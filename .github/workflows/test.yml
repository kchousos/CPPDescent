name: tests

defaults:
  run:
    working-directory: ./

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
      # with:
      #   lfs: 'true'
    # - name: checkoutLFS
    #   uses: actions/checkout@v4
    # - run: git lfs pull
    - name: build the tests
      run: ./helper.sh --clean-build
    - name: Create the cache directory
      run: mkdir -p build/cache
    - name: run the tests
      run: ./helper.sh --tests
